spring.application.name=resource-booking

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resource_booking}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT secret must be overridden via env var in real deployments:
# export JWT_SECRET="a-long-random-production-secret"
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-deploying-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
